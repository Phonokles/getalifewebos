<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="paint.css">
</head>
<body>

<div class="gallery" id="gallery">
  <div class="gallery-bar">
    <span class="gallery-title">Gallery</span>
    <button class="pt-btn" id="new-canvas">+ New</button>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
</div>

<div class="studio" id="studio">

  <div class="studio-bar">
    <button class="pt-btn" id="to-gallery">&lsaquo; Gallery</button>
    <input type="text" class="studio-name" id="filename" value="drawing.png" spellcheck="false">
    <div class="studio-tools">
      <button class="tool" id="tool-brush" title="Brush">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 3.5l5 5L9 20H4v-5z"/><line x1="13" y1="6" x2="18" y2="11"/>
        </svg>
      </button>
      <button class="tool" id="tool-eraser" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16l7-7 6 6-4 4H6z"/><line x1="9" y1="20" x2="20" y2="20"/>
        </svg>
      </button>
      <button class="tool swatch" id="tool-color" title="Color"><span id="swatch-dot"></span></button>
      <button class="tool" id="tool-save" title="Save to files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="studio-body">
    <div class="rail">
      <div class="slider" id="slider-size" title="Size">
        <div class="slider-fill"></div>
      </div>
      <span class="rail-label" id="size-label">5</span>

      <div class="slider" id="slider-alpha" title="Opacity">
        <div class="slider-fill"></div>
      </div>
      <span class="rail-label" id="alpha-label">100</span>

      <button class="rail-btn arrow" id="btn-undo" title="Undo">&lsaquo;</button>
      <button class="rail-btn arrow" id="btn-redo" title="Redo">&rsaquo;</button>
      <button class="rail-btn" id="btn-clear" title="Clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>
        </svg>
      </button>
    </div>

    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div class="palette" id="palette">
    <div class="pick-sv" id="pick-sv"><span class="pick-dot" id="sv-dot"></span></div>
    <div class="pick-side">
      <div class="pick-hue" id="pick-hue"><span class="pick-bar" id="hue-bar"></span></div>
      <div class="pick-foot">
        <span class="pick-preview" id="pick-preview"></span>
        <input type="text" class="pick-hex" id="pick-hex" spellcheck="false" maxlength="7">
      </div>
    </div>
  </div>

</div>

<script src="../../keybinds/keyforward.js"></script>
<script src="paint.js"></script>
</body>
</html>
