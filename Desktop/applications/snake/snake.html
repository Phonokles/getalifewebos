<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <div class="snake-app">
    
    <div class="snake-topbar">
      <span class="snake-title">SNAKE</span>
      <div class="snake-scores">
        <span class="snake-score">score <b id="snake-score">0</b></span>
        <span class="snake-score">best <b id="snake-best">0</b></span>
      </div>
    </div>

    <div class="snake-stage">
      <canvas id="snake-canvas" width="420" height="420"></canvas>

      <div class="snake-overlay" id="snake-overlay">
        <div class="snake-overlay-title" id="snake-overlay-title">snake [*_*]</div>
        <div class="snake-overlay-text" id="snake-overlay-text">press any key to start<br>arrows / wasd to move space to pause</div>
      </div>
    </div>

  </div>

  <script src="snake.js"></script>
</body>
</html>
