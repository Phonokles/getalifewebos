<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <div class="wel">

    <div class="wel-top">
      <h1 class="wel-title">Have a Life WebOS</h1>
      <span class="wel-face">[*_*]</span>
    </div>

    <div class="wel-grid" id="app-grid"></div>

    <div class="wel-keys">
      <span class="wel-key"><b>alt</b> launcher</span>
      <span class="wel-key"><b>ctrl+alt+k</b> all keys</span>
      <span class="wel-key"><b>ctrl+alt+w</b> tiling</span>
      <span class="wel-key"><b>ctrl+alt+1-4</b> workspace</span>
    </div>

    <div class="wel-foot">
      <span class="wel-dev">phonokles &middot; <span id="age-counter">...</span>years old[-_-]</span>
      <label class="wel-check">
        <input type="checkbox" id="show-again">
        <span>show on start</span>
      </label>
    </div>

  </div>

  <script src="../../keybinds/keyforward.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
