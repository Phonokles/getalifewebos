<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="code.css">
</head>
<body>
  <div class="code-app">

    <div class="start-view" id="start-view">
      <div class="start-inner">
        <div class="start-title">Code</div>

        <div class="start-actions">
          <button class="start-card" id="start-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span class="start-card-name">New project</span>
            <span class="start-card-hint">a folder with a first file</span>
          </button>

          <button class="start-card" id="start-file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
              <path d="M14 3v5h5"/>
            </svg>
            <span class="start-card-name">Single file</span>
            <span class="start-card-hint">just start typing</span>
          </button>

          <button class="start-card" id="start-clone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3v12"/><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>
            </svg>
            <span class="start-card-name">Clone from GitHub</span>
            <span class="start-card-hint">pull a repo into your files</span>
          </button>
        </div>

        <div class="gh-bar" id="gh-bar"></div>

        <div class="start-recent" id="start-recent"></div>
      </div>
    </div>

    <div class="new-view" id="new-view">
      <div class="new-inner">
        <button class="new-back" id="new-back">&lsaquo; back</button>
        <div class="new-title" id="new-title">New project</div>

        <label class="new-label">Name</label>
        <input type="text" class="new-input" id="new-name" spellcheck="false" autocomplete="off">

        <label class="new-label">File type</label>
        <div class="type-select" id="type-select">
          <button class="type-current" id="type-current">
            <span id="type-current-name">Choose</span>
            <span class="type-caret">&rsaquo;</span>
          </button>

          <div class="type-drop" id="type-drop">
            <input type="text" class="type-search" id="type-search" placeholder="search types..." spellcheck="false" autocomplete="off">
            <div class="type-list" id="type-list"></div>
          </div>
        </div>

        <button class="new-create" id="new-create">Create</button>
        <div class="new-hint" id="new-hint"></div>
      </div>
    </div>

    <div class="editor-view" id="editor-view">
      <div class="editor-side" id="editor-side">
        <div class="side-head">
          <span class="side-title" id="side-title">files</span>
          <button class="side-btn" id="side-new" title="New file here">+</button>
        </div>
        <div class="side-tree" id="side-tree"></div>
      </div>

      <div class="editor-main">
        <div class="editor-topbar">
          <button class="editor-icon-btn" id="btn-toggle-side" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
            </svg>
          </button>
          <input type="text" class="editor-filename" id="editor-filename" spellcheck="false">
          <div class="editor-actions">
            <button class="editor-btn editor-btn-run" id="btn-run">Run &#9654;</button>
            <button class="editor-btn" id="btn-change-type">Type</button>
            <button class="editor-btn" id="btn-commit">Commit &#8593;</button>
            <button class="editor-btn" id="btn-add-local">Download</button>
            <button class="editor-btn editor-btn-primary" id="btn-add-data">Save</button>
          </div>
        </div>

        <div class="editor-body" id="editor-body">
          <textarea class="editor-textarea" id="editor-textarea" spellcheck="false" placeholder="start typing..."></textarea>
          <div class="drop-hint" id="drop-hint">drop a file to open it</div>
        </div>
      </div>
    </div>

  </div>

  <div class="gh-modal" id="gh-modal">
    <div class="gh-modal-box">
      <button class="gh-modal-close" id="gh-modal-close">&times;</button>
      <div class="gh-modal-title" id="gh-modal-title">GitHub</div>
      <div class="gh-modal-body" id="gh-modal-body"></div>
      <div class="gh-modal-status" id="gh-modal-status"></div>
    </div>
  </div>

  <script src="../../keybinds/keyforward.js"></script>
  <script src="github.js"></script>
  <script src="code.js"></script>
</body>
</html>
