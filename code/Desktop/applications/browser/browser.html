<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <div class="br">

    <div class="br-tabs" id="tabs">
      <button class="br-newtab" id="new-tab" title="New tab">+</button>
    </div>

    <div class="br-bar">
      <button class="br-nav" id="back" title="Back">&lsaquo;</button>
      <button class="br-nav" id="forward" title="Forward">&rsaquo;</button>
      <button class="br-nav" id="reload" title="Reload">&#8635;</button>
      <input type="text" class="br-url" id="url" placeholder="search or enter a url" spellcheck="false" autocomplete="off">
      <button class="br-nav" id="external" title="Open in a real browser tab">&#8599;</button>
    </div>

    <div class="br-views" id="views"></div>

  </div>

  <script src="../../keybinds/keyforward.js"></script>
  <script src="browser.js"></script>
</body>
</html>
