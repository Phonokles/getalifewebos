<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <div class="term" id="term">
    <div class="term-output" id="term-output"></div>
    <div class="term-input-row">
      <span class="term-prompt" id="term-prompt">user@webos:~$</span>
      <input type="text" id="term-input" class="term-input" autocomplete="off" spellcheck="false" autofocus>
    </div>
  </div>

  <!-- nano: fullscreen editor overlay inside the terminal -->
  <div class="nano" id="nano">
    <div class="nano-header">
      <span>nano</span>
      <span id="nano-filename"></span>
      <span id="nano-status"></span>
    </div>
    <textarea id="nano-text" class="nano-text" spellcheck="false"></textarea>
    <div class="nano-footer">
      <span><b>^S</b> save</span>
      <span><b>^X</b> exit</span>
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
