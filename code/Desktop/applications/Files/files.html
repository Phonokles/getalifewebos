<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="files.css">
</head>
<body>
  <div class="files-app">

    <div class="files-topbar">
      <div class="files-breadcrumb" id="files-breadcrumb"></div>
      <div class="files-actions">
        <button class="files-btn" id="btn-new-folder">Create folder</button>
        <button class="files-btn" id="btn-new-file">Create file</button>
      </div>
    </div>


    <div class="files-create-row" id="files-create-row">
      <input type="text" id="files-create-input" class="files-create-input" spellcheck="false">
      <button class="files-btn files-btn-primary" id="files-create-confirm">Create</button>
      <button class="files-btn" id="files-create-cancel">Cancel</button>
    </div>
    <div class="files-create-hint" id="files-create-hint"></div>

    <div class="files-body" id="files-body"></div>

    <div class="files-statusbar" id="files-statusbar">RAM only — gone after reload</div>

  </div>

  <script src="files.js"></script>
</body>
</html>
